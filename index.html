<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Clima | App Web</title>
  
  <!-- Tipografías de Google Fonts: Outfit (Títulos) e Inter (Texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Iconos de Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-card: rgba(22, 27, 34, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --danger-color: #ff5555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #1a2332, #0d1117);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-blue));
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Alertas y avisos */
    .protocol-warning {
      background: rgba(255, 170, 0, 0.15);
      border: 1px solid #ffaa00;
      color: #ffcc00;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }

    .error-message {
      color: var(--danger-color);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    /* Historial de búsquedas */
    .history-container {
      margin-bottom: 20px;
    }

    .history-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .tag:hover {
      background: rgba(0, 242, 254, 0.2);
    }

    /* Tarjeta del Clima */
    .weather-card {
      display: none;
      text-align: center;
      margin-top: 24px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto;
    }

    .temp {
      font-family: 'Outfit', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      margin: 8px 0;
    }

    .city-name {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .condition {
      font-size: 1rem;
      color: var(--primary-cyan);
      text-transform: capitalize;
      margin-top: 4px;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .detail-item span {
      color: var(--text-main);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Buscador de Clima</h1>

    <!-- Aviso de protocolo file:// -->
    <div id="protocolWarning" class="protocol-warning">
      ⚠️ Estás abriendo el archivo directamente (file://). Para asegurar el funcionamiento de la API, se recomienda usar Live Server o un servidor local.
    </div>

    <!-- Buscador -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Escribe una ciudad..." autocomplete="off">
      <button id="searchBtn">
        <i data-lucide="search"></i>
      </button>
    </div>

    <!-- Mensaje de Error -->
    <div id="errorMessage" class="error-message"></div>

    <!-- Historial de Búsquedas Recientes -->
    <div class="history-container" id="historyContainer" style="display: none;">
      <div class="history-title">Búsquedas recientes</div>
      <div class="history-tags" id="historyTags"></div>
    </div>

    <!-- Tarjeta de Resultados -->
    <div id="weatherCard" class="weather-card">
      <div id="cityDisplay" class="city-name">--</div>
      <img id="weatherIcon" class="weather-icon" src="" alt="Icono del clima">
      <div id="tempDisplay" class="temp">--°C</div>
      <div id="conditionDisplay" class="condition">--</div>

      <div class="details">
        <div class="detail-item">
          <i data-lucide="droplets"></i>
          Humedad: <span id="humidityDisplay">--%</span>
        </div>
        <div class="detail-item">
          <i data-lucide="wind"></i>
          Viento: <span id="windDisplay">-- km/h</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inicializar iconos
    lucide.createIcons();

    // Detección de protocolo file:// (Prompt 4)
    if (window.location.protocol === 'file:') {
      document.getElementById('protocolWarning').style.display = 'block';
    }

    const apiKey = 'bd5e378503939ddaee76f12ad7a97608'; // Clave de demostración para consulta pública
    const searchBtn = document.getElementById('searchBtn');
    const cityInput = document.getElementById('cityInput');
    const weatherCard = document.getElementById('weatherCard');
    const errorMessage = document.getElementById('errorMessage');
    const historyContainer = document.getElementById('historyContainer');
    const historyTags = document.getElementById('historyTags');

    let searchHistory = [];

    // Event listener para búsqueda
    searchBtn.addEventListener('click', () => {
      const city = cityInput.value.trim();
      if (city) {
        getWeather(city);
      } else {
        showError('Por favor, escribe el nombre de una ciudad.');
      }
    });

    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchBtn.click();
      }
    });

    // Función principal para obtener el clima (Prompt 2, 3 y 4)
    async function getWeather(city) {
      errorMessage.style.display = 'none';
      
      try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric&lang=es`);
        
        if (!response.ok) {
          throw new Error('Ciudad no encontrada o error en la petición.');
        }

        const data = await response.json();
        updateUI(data);
        updateHistory(data.name);

      } catch (error) {
        weatherCard.style.display = 'none';
        showError(error.message);
      }
    }

    // Actualizar la interfaz
    function updateUI(data) {
      document.getElementById('cityDisplay').textContent = `${data.name}, ${data.sys.country}`;
      document.getElementById('tempDisplay').textContent = `${Math.round(data.main.temp)}°C`;
      document.getElementById('conditionDisplay').textContent = data.weather[0].description;
      document.getElementById('humidityDisplay').textContent = `${data.main.humidity}%`;
      document.getElementById('windDisplay').textContent = `${Math.round(data.wind.speed * 3.6)} km/h`;

      const iconCode = data.weather[0].icon;
      document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

      weatherCard.style.display = 'block';
    }

    // Restricción del historial a máx 5 búsquedas únicas (Prompt 5)
    function updateHistory(cityName) {
      searchHistory = searchHistory.filter(item => item.toLowerCase() !== cityName.toLowerCase());
      searchHistory.unshift(cityName);
      searchHistory = searchHistory.slice(0, 5); // Límite máximo de 5

      renderHistory();
    }

    function renderHistory() {
      historyTags.innerHTML = '';
      if (searchHistory.length > 0) {
        historyContainer.style.display = 'block';
        searchHistory.forEach(city => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = city;
          tag.onclick = () => {
            cityInput.value = city;
            getWeather(city);
          };
          historyTags.appendChild(tag);
        });
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = 'block';
    }
  </script>
</body>
</html>
